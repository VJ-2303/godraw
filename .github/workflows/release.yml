name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true

      - name: Test
        run: go test ./...

      - name: Sync version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$version\"/" mygo.json
          echo "Building godraw $version"

      - name: Build linux binaries and packages
        run: go tool mygo build -platform linux/amd64,linux/arm64

      - name: Checksums
        run: |
          cd build
          sha256sum linux-amd64/* linux-arm64/* > sha256sums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/linux-amd64/godraw-*.tar.gz
            build/linux-amd64/*.deb
            build/linux-amd64/PKGBUILD
            build/linux-arm64/godraw-*.tar.gz
            build/linux-arm64/*.deb
            build/linux-arm64/PKGBUILD
            build/sha256sums.txt
